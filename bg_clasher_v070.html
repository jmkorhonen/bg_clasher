let tacticalDraft = null;
let tacticalPreviewLayer = null;
let selectedTacticalGraphicId = null;

function tacticalRendererAvailable() {
  return !!(window.C5Ren && C5Ren.WebRenderer && C5Ren.WebRenderer.RenderSymbol2D);
}

function tacticalPreset(id) {
  return TACTICAL_GRAPHIC_PRESETS.find(p => p.id === id) || TACTICAL_GRAPHIC_PRESETS[0];
}

function tacticalStatusText() {
  if (tacticalRendererAvailable() && window.tacticalRendererInlineFallback) return 'Mission Command renderer loaded (inline prototype fallback)';
  if (tacticalRendererAvailable()) return 'Mission Command renderer loaded from CDN';
  if (window.tacticalRendererLoadFailed) return 'Mission Command renderer failed to load';
  return 'Mission Command renderer not ready yet';
}

function tacticalMapObject(obj) {
  const m = new Map();
  Object.entries(obj || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null && String(v) !== '') m.set(k, String(v));
  });
  return m;
}

function tacticalControlPoints(points) {
  return (points || []).map(p => `${p[1]},${p[0]}`).join(' ');
}

function tacticalBbox() {
  const b = map.getBounds();
  return `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
}

function tacticalPixelSize() {
  const sz = map.getSize();
  return { w: Math.max(1, Math.round(sz.x)), h: Math.max(1, Math.round(sz.y)) };
}

function tacticalStyleForFeature(feature, fallbackColor, fallbackFill) {
  const p = feature && feature.properties ? feature.properties : {};
  const stroke = p.stroke || p.lineColor || p.LINECOLOR || fallbackColor;
  const fill = p.fill || p.fillColor || p.FILLCOLOR || fallbackFill || stroke;
  const weight = parseFloat(p['stroke-width'] || p.lineWidth || p.LINEWIDTH || 1);
  const fillOpacity = feature?.geometry?.type?.includes('Polygon') ? 0.14 : 0;
  return {
    color: stroke,
    weight: Number.isFinite(weight) ? weight : 1,
    opacity: 1,
    fillColor: fill,
    fillOpacity
  };
}

function tacticalPointLayer(feature, latlng) {
  const p = feature && feature.properties ? feature.properties : {};
  const text = p.label || p.name || p.text || p.description || '';
  if (text) {
    const html = `<div class="measure-label">${esc(String(text))}</div>`;
    return L.marker(latlng, {
      icon: L.divIcon({ className: '', html, iconSize: null, iconAnchor: [0, 0] }),
      interactive: false
    });
  }
  return L.circleMarker(latlng, {
    radius: 4,
    color: '#111',
    fillColor: '#fff',
    fillOpacity: 0.9,
    weight: 1,
    interactive: false
  });
}

function tacticalFallbackLayer(d, layer, message) {
  const props = d.properties || {};
  const tg = props.tactical || {};
  const points = d.geometry?.points || [];
  const color = d.style?.color || layer?.color || '#f5a623';
  const opts = {
    color,
    weight: d.style?.weight || 1,
    dashArray: '5,5',
    opacity: 0.95,
    fillOpacity: tg.geometry === 'area' ? 0.12 : 0.02
  };
  let fallback = null;
  if (tg.geometry === 'area' && points.length >= 3) fallback = L.polygon(points, opts);
  else if (points.length >= 2) fallback = L.polyline(points, opts);
  else if (points.length === 1) fallback = L.circleMarker(points[0], { radius: 7, ...opts, fillColor: color });
  if (fallback) {
    fallback.bindTooltip(`${props.label || tg.name || 'Tactical graphic'}: ${message}`, { sticky: true, className: 'marker-tooltip' });
  }
  return fallback;
}

function tacticalIsFlotSpec(spec) {
  return !!spec && (spec.renderer === 'custom-flot' || spec.presetId === 'flot');
}

function tacticalIsPointSymbolSpec(spec) {
  return !!spec && (spec.drawMode === 'point-symbol' || spec.geometry === 'point-symbol');
}

function tacticalPointSymbolRendererAvailable() {
  return !!(window.C5Ren && C5Ren.MilStdIconRenderer && C5Ren.MilStdIconRenderer.getInstance);
}

function tacticalSvgDataUri(svg) {
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function tacticalReadableTextAngle(angle) {
  let a = ((angle + 180) % 360) - 180;
  if (a > 90) a -= 180;
  if (a < -90) a += 180;
  return a;
}

function tacticalClamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function tacticalDefaultPointSymbolPoints(latlng, preset) {
  const size = preset.pixelSize || 72;
  const anchor = map.latLngToLayerPoint(latlng);
  const direction = map.layerPointToLatLng(L.point(anchor.x + size * 0.62, anchor.y));
  const width = map.layerPointToLatLng(L.point(anchor.x, anchor.y + size * 0.42));
  return [
    [latlng.lat, latlng.lng],
    [direction.lat, direction.lng],
    [width.lat, width.lng]
  ].slice(0, preset.controlPoints || 3);
}

function tacticalPointSymbolTransform(d, options = {}) {
  const points = d.geometry?.points || [];
  const tg = d.properties?.tactical || {};
  const baseSize = options.size || tg.pixelSize || 72;
  const result = { size: baseSize, angle: 0, widthScale: 1, boxSize: baseSize + 14 };
  if (!points.length) return result;

  const anchor = map.latLngToLayerPoint(L.latLng(points[0][0], points[0][1]));
  let ux = 1;
  let uy = 0;
  if (points[1]) {
    const dir = map.latLngToLayerPoint(L.latLng(points[1][0], points[1][1]));
    const dx = dir.x - anchor.x;
    const dy = dir.y - anchor.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 3) {
      result.size = tacticalClamp(dist * 2, 36, 190);
      result.angle = Math.atan2(dy, dx) * 180 / Math.PI;
      ux = dx / dist;
      uy = dy / dist;
    }
  }
  if (points[2]) {
    const side = map.latLngToLayerPoint(L.latLng(points[2][0], points[2][1]));
    const sx = side.x - anchor.x;
    const sy = side.y - anchor.y;
    const nx = -uy;
    const ny = ux;
    const width = Math.abs(sx * nx + sy * ny) * 2;
    if (width > 4) result.widthScale = tacticalClamp(width / result.size, 0.45, 2.2);
  }
  result.boxSize = Math.ceil(result.size * Math.max(1.3, result.widthScale) + 18);
  return result;
}

function tacticalDraftAsDrawing(points) {
  if (!tacticalDraft) return null;
  const preset = tacticalPreset(tacticalDraft.presetId);
  return {
    id: 'tactical-draft-preview',
    type: 'tactical-graphic',
    layerId: state.currentLayerId,
    geometry: { points: cloneDeep(points || tacticalDraft.points || []) },
    style: { color: tacticalDraft.color, fillColor: tacticalDraft.fill, weight: tacticalDraft.weight },
    properties: {
      label: tacticalDraft.label,
      tactical: {
        presetId: preset.id,
        name: preset.name,
        symbolCode: preset.sidc,
        geometry: preset.geometry,
        renderer: preset.renderer || '',
        drawMode: preset.drawMode || preset.geometry,
        minPoints: preset.minPoints,
        pixelSize: preset.pixelSize || 72,
        controlPoints: preset.controlPoints || 0,
        fallbackText: preset.fallbackText || '',
        arrowStyle: preset.arrowStyle || '',
        lineLabel: preset.lineLabel || '',
        lineSubLabel: preset.lineSubLabel || '',
        areaLabel: preset.areaLabel || '',
        areaName: preset.areaName || '',
        echelon: preset.echelon || '',
        doubleFront: !!preset.doubleFront,
        flipFront: !!tacticalDraft.flipFront,
        modifiers: cloneDeep(preset.modifiers || {}),
        attributes: cloneDeep(preset.attributes || {}),
        description: preset.description || ''
      }
    }
  };
}

function stopLeafletClick(e) {
  if (e && e.originalEvent) L.DomEvent.stop(e.originalEvent);
}

function tacticalLayerClicked(d, e) {
  stopLeafletClick(e);
  selectTacticalGraphic(d);
}

function clearTacticalSelection() {
  selectedTacticalGraphicId = null;
  LG.tacticalEdit.clearLayers();
}

function selectTacticalGraphic(d) {
  if (!d || d.type !== 'tactical-graphic') return;
  selectedTacticalGraphicId = d.id;
  renderTacticalControlPoints();
  const tg = d.properties?.tactical || {};
  const canEdit = canEditLayer(getLayer(d.layerId));
  document.getElementById('modeDisplay').textContent = canEdit
    ? `${d.properties?.label || tg.name || 'Tactical graphic'} selected - drag control point(s) to edit`
    : `${d.properties?.label || tg.name || 'Tactical graphic'} selected`;
}

function renderTacticalControlPoints() {
  LG.tacticalEdit.clearLayers();
  if (!selectedTacticalGraphicId) return;
  const d = state.drawings.find(x => x.id === selectedTacticalGraphicId);
  if (!d || d.type !== 'tactical-graphic' || d.visible === false) {
    selectedTacticalGraphicId = null;
    return;
  }
  const layer = getLayer(d.layerId);
  if (!layer || !canSeeLayer(layer)) {
    selectedTacticalGraphicId = null;
    return;
  }
  const canEdit = !isMirrorMode && canEditLayer(layer);
  const color = d.style?.color || layer.color || '#e94560';
  const tg = d.properties?.tactical || {};
  const pts = d.geometry?.points || [];
  if (tacticalIsPointSymbolSpec(tg) && pts.length > 1) {
    [1, 2].forEach(idx => {
      if (!pts[idx]) return;
      L.polyline([pts[0], pts[idx]], {
        color,
        weight: 1,
        dashArray: '3,3',
        opacity: 0.75,
        interactive: false
      }).addTo(LG.tacticalEdit);
    });
  }
  pts.forEach((p, idx) => {
    const label = tacticalControlPointLabel(d, idx);
    const html = `<div class="tg-control-point" style="background:${color}"><span class="tg-control-index">${idx + 1}</span></div>`;
    const handle = L.marker(p, {
      icon: L.divIcon({ className: '', html, iconSize: [18, 18], iconAnchor: [9, 9] }),
      draggable: canEdit,
      interactive: true,
      bubblingMouseEvents: false,
      keyboard: false,
      zIndexOffset: 1000
    });
    handle._drawingId = d.id;
    handle.bindTooltip(label, { className: 'marker-tooltip', direction: 'top' });
    handle.on('click', stopLeafletClick);
    handle.on('dragend', e => {
      const ll = e.target.getLatLng();
      if (tacticalIsPointSymbolSpec(tg) && idx === 0) {
        const oldAnchor = map.latLngToLayerPoint(L.latLng(d.geometry.points[0][0], d.geometry.points[0][1]));
        const newAnchor = map.latLngToLayerPoint(ll);
        const delta = L.point(newAnchor.x - oldAnchor.x, newAnchor.y - oldAnchor.y);
        d.geometry.points = d.geometry.points.map(pt => {
          const lp = map.latLngToLayerPoint(L.latLng(pt[0], pt[1]));
          const moved = map.layerPointToLatLng(L.point(lp.x + delta.x, lp.y + delta.y));
          return [moved.lat, moved.lng];
        });
      } else {
        d.geometry.points[idx] = [ll.lat, ll.lng];
      }
      renderDrawings();
      renderTacticalControlPoints();
      refreshTacticalPanelIfOpen();
      syncMirrors();
    });
    LG.tacticalEdit.addLayer(handle);
  });
}

function tacticalControlPointLabel(d, idx) {
  const tg = d.properties?.tactical || {};
  if (tacticalIsPointSymbolSpec(tg)) {
    if (idx === 0) return 'Anchor / move symbol';
    if (idx === 1) return 'Direction and length';
    if (idx === 2) return 'Width / footprint';
  }
  return `Control point ${idx + 1}`;
}

function renderTacticalFlotLayer(d, layer, options = {}) {
  const props = d.properties || {};
  const tg = props.tactical || {};
  const points = d.geometry?.points || [];
  if (points.length < 2) return tacticalFallbackLayer(d, layer, 'FLOT needs at least 2 points');

  const color = d.style?.color || layer?.color || '#2d74c4';
  const weight = d.style?.weight || 1;
  const radius = Math.max(9, Math.min(24, weight * 4.5));
  const spacing = radius * 2;
  const group = L.layerGroup();
  const interactive = options.interactive !== false;
  const frontSign = tg.flipFront ? -1 : 1;
  const frontSigns = tg.doubleFront ? [-1, 1] : [frontSign];
  const rowOffset = tg.doubleFront ? radius * 0.85 : 0;
  let firstSeg = null;
  let lastSeg = null;

  for (let i = 1; i < points.length; i++) {
    const a = map.latLngToLayerPoint(L.latLng(points[i - 1][0], points[i - 1][1]));
    const b = map.latLngToLayerPoint(L.latLng(points[i][0], points[i][1]));
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) continue;

    const ux = dx / len;
    const uy = dy / len;
    const seg = { a, b, ux, uy, angle: Math.atan2(dy, dx) * 180 / Math.PI };
    if (!firstSeg) firstSeg = seg;
    lastSeg = seg;

    const centers = [];
    if (len < radius * 2.4) {
      centers.push(len / 2);
    } else {
      for (let dist = radius; dist <= len - radius; dist += spacing) centers.push(dist);
    }

    centers.forEach(dist => {
      frontSigns.forEach(sign => {
        const nx = -uy * sign;
        const ny = ux * sign;
        const cx = a.x + ux * dist + nx * rowOffset;
        const cy = a.y + uy * dist + ny * rowOffset;
        const arc = [];
        const arcSteps = 40;
        for (let step = 0; step <= arcSteps; step++) {
          const theta = Math.PI - (Math.PI * step / arcSteps);
          const px = cx + ux * radius * Math.cos(theta) + nx * radius * Math.sin(theta);
          const py = cy + uy * radius * Math.cos(theta) + ny * radius * Math.sin(theta);
          arc.push(map.layerPointToLatLng(L.point(px, py)));
        }
        const arcLayer = L.polyline(arc, {
          color,
          weight,
          opacity: 1,
          interactive,
          bubblingMouseEvents: false,
          smoothFactor: 0,
          className: 'tg-flot-arc'
        });
        arcLayer._drawingId = d.id;
        if (interactive) {
          arcLayer.on('click', e => tacticalLayerClicked(d, e));
        }
        group.addLayer(arcLayer);
      });
    });
  }

  if (firstSeg && lastSeg) {
    const labelSize = Math.max(10, Math.round(radius * 0.72));
    const labelPad = Math.max(18, radius * 1.1);
    const labelText = tg.lineLabel || 'FLOT';
    const addLabel = (pt, angle) => {
      const html = `<div class="tg-flot-label" style="color:${color};font-size:${labelSize}px;transform:rotate(${tacticalReadableTextAngle(angle)}deg)">${esc(labelText)}</div>`;
      const marker = L.marker(map.layerPointToLatLng(pt), {
        icon: L.divIcon({ className: 'tg-flot-label-icon', html, iconSize: [64, 20], iconAnchor: [32, 10] }),
        interactive: false,
        keyboard: false
      });
      marker._drawingId = d.id;
      group.addLayer(marker);
    };
    addLabel(L.point(firstSeg.a.x - firstSeg.ux * labelPad, firstSeg.a.y - firstSeg.uy * labelPad), firstSeg.angle);
    addLabel(L.point(lastSeg.b.x + lastSeg.ux * labelPad, lastSeg.b.y + lastSeg.uy * labelPad), lastSeg.angle);
  }

  return group;
}

function tacticalPointSymbolIcon(d, layer, options = {}) {
  const props = d.properties || {};
  const tg = props.tactical || {};
  const transform = tacticalPointSymbolTransform(d, options);
  const size = Math.round(transform.size);
  const boxSize = Math.round(transform.boxSize);
  const color = d.style?.color || layer?.color || '#2d74c4';
  const fill = d.style?.fillColor || tg.fillColor || '#ffffff';
  let svg = null;

  if (tacticalPointSymbolRendererAvailable() && tg.symbolCode) {
    try {
      if (C5Ren.init) C5Ren.init();
      const ma = C5Ren.MilStdAttributes || {};
      const attrs = new Map();
      const setAttr = (key, value) => { if (key) attrs.set(key, String(value)); };
      setAttr(ma.PixelSize || 'PixelSize', size);
      setAttr(ma.DrawAsIcon || 'DrawAsIcon', false);
      setAttr(ma.KeepUnitRatio || 'KeepUnitRatio', true);
      setAttr(ma.LineColor || 'LineColor', color);
      setAttr(ma.FillColor || 'FillColor', fill);
      Object.entries(tg.attributes || {}).forEach(([k, v]) => setAttr(k, v));
      const modifiers = tacticalMapObject({
        T_UNIQUE_DESIGNATION_1: props.label || tg.name || '',
        ...(tg.modifiers || {})
      });
      const si = C5Ren.MilStdIconRenderer.getInstance().RenderSVG(tg.symbolCode, modifiers, attrs);
      if (si && si.getSVG) svg = si.getSVG();
    } catch (err) {
      console.warn('[bg_clasher] tactical point symbol render failed', err);
    }
  }

  const innerTransform = `rotate(${transform.angle.toFixed(1)}deg) scaleX(${transform.widthScale.toFixed(2)})`;
  if (svg) {
    const html = `<div class="tg-point-symbol-wrap" style="width:${boxSize}px;height:${boxSize}px"><img src="${tacticalSvgDataUri(svg)}" alt="" style="width:${size}px;height:${size}px;transform:${innerTransform};transform-origin:center"></div>`;
    return L.divIcon({ className: 'tg-point-symbol-icon', html, iconSize: [boxSize, boxSize], iconAnchor: [boxSize / 2, boxSize / 2] });
  }

  const initials = (tg.fallbackText || tg.name || props.label || 'TG').split(/\s+/).map(w => w[0]).join('').slice(0, 4).toUpperCase();
  const html = `<div class="tg-point-symbol-wrap" style="width:${boxSize}px;height:${boxSize}px"><div class="tg-point-symbol-fallback" style="color:${color};transform:${innerTransform};transform-origin:center">${esc(initials)}</div></div>`;
  return L.divIcon({ className: '', html, iconSize: [boxSize, boxSize], iconAnchor: [boxSize / 2, boxSize / 2] });
}

function renderTacticalPointSymbolLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];
  if (!points.length) return null;
  const interactive = options.interactive !== false;
  const marker = L.marker(points[0], {
    icon: tacticalPointSymbolIcon(d, layer, options),
    draggable: false,
    interactive,
    bubblingMouseEvents: false
  });
  marker._drawingId = d.id;
  if (interactive) {
    marker.on('click', e => tacticalLayerClicked(d, e));
    marker.on('dragend', e => {
      const p = e.target.getLatLng();
      d.geometry.points[0] = [p.lat, p.lng];
      renderDrawings();
      renderTacticalControlPoints();
      refreshTacticalPanelIfOpen();
      syncMirrors();
    });
  }
  return marker;
}

function renderTacticalAttackArrowLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];
  if (points.length < 2) return tacticalFallbackLayer(d, layer, 'Attack arrow needs at least 2 points');
  const props = d.properties || {};
  const tg = props.tactical || {};
  const color = d.style?.color || layer?.color || '#e94560';
  const weight = d.style?.weight || 1;
  const interactive = options.interactive !== false;
  const group = L.layerGroup();
  const line = L.polyline(points, {
    color,
    weight,
    opacity: 1,
    dashArray: tg.arrowStyle === 'supporting' ? '10,6' : null,
    interactive,
    bubblingMouseEvents: false,
    className: 'tg-attack-arrow'
  });
  line._drawingId = d.id;
  if (interactive) line.on('click', e => tacticalLayerClicked(d, e));
  group.addLayer(line);

  const a = map.latLngToLayerPoint(L.latLng(points[points.length - 2][0], points[points.length - 2][1]));
  const b = map.latLngToLayerPoint(L.latLng(points[points.length - 1][0], points[points.length - 1][1]));
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len > 1) {
    const ux = dx / len;
    const uy = dy / len;
    const nx = -uy;
    const ny = ux;
    const head = Math.max(18, weight * 5);
    const spread = head * 0.58;
    const left = map.layerPointToLatLng(L.point(b.x - ux * head + nx * spread, b.y - uy * head + ny * spread));
    const right = map.layerPointToLatLng(L.point(b.x - ux * head - nx * spread, b.y - uy * head - ny * spread));
    const tip = map.layerPointToLatLng(b);
    const headLine = L.polyline([left, tip, right], {
      color,
      weight,
      opacity: 1,
      interactive,
      bubblingMouseEvents: false,
      className: 'tg-attack-arrow-head'
    });
    headLine._drawingId = d.id;
    if (interactive) headLine.on('click', e => tacticalLayerClicked(d, e));
    group.addLayer(headLine);
  }
  return group;
}

function renderTacticalLabeledLineLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];
  if (points.length < 2) return tacticalFallbackLayer(d, layer, 'Line needs at least 2 points');
  const props = d.properties || {};
  const tg = props.tactical || {};
  const color = d.style?.color || layer?.color || '#f5a623';
  const weight = d.style?.weight || 1;
  const interactive = options.interactive !== false;
  const group = L.layerGroup();
  const line = L.polyline(points, {
    color,
    weight,
    opacity: 1,
    dashArray: tg.lineDash || null,
    interactive,
    bubblingMouseEvents: false,
    className: 'tg-labeled-line'
  });
  line._drawingId = d.id;
  if (interactive) line.on('click', e => tacticalLayerClicked(d, e));
  group.addLayer(line);

  const label = tg.lineLabel || (props.label && props.label !== 'TG-1' ? props.label : (tg.name || ''));
  const subLabel = tg.lineSubLabel || '';
  const addLabel = (pt, angle) => {
    const html = `<div class="tg-flot-label" style="color:${color};font-size:11px;line-height:1.05;transform:rotate(${tacticalReadableTextAngle(angle)}deg)">${esc(label)}${subLabel ? `<br><span style="font-size:9px">${esc(subLabel)}</span>` : ''}</div>`;
    const marker = L.marker(map.layerPointToLatLng(pt), {
      icon: L.divIcon({ className: 'tg-flot-label-icon', html, iconSize: [64, 20], iconAnchor: [32, 10] }),
      interactive: false,
      keyboard: false
    });
    marker._drawingId = d.id;
    group.addLayer(marker);
  };
  const start = map.latLngToLayerPoint(L.latLng(points[0][0], points[0][1]));
  const second = map.latLngToLayerPoint(L.latLng(points[1][0], points[1][1]));
  const beforeLast = map.latLngToLayerPoint(L.latLng(points[points.length - 2][0], points[points.length - 2][1]));
  const end = map.latLngToLayerPoint(L.latLng(points[points.length - 1][0], points[points.length - 1][1]));
  const startAngle = Math.atan2(second.y - start.y, second.x - start.x) * 180 / Math.PI;
  const endAngle = Math.atan2(end.y - beforeLast.y, end.x - beforeLast.x) * 180 / Math.PI;
  const pad = 18;
  const startLen = Math.max(1, Math.hypot(second.x - start.x, second.y - start.y));
  const endLen = Math.max(1, Math.hypot(end.x - beforeLast.x, end.y - beforeLast.y));
  addLabel(L.point(start.x - (second.x - start.x) / startLen * pad, start.y - (second.y - start.y) / startLen * pad), startAngle);
  addLabel(L.point(end.x + (end.x - beforeLast.x) / endLen * pad, end.y + (end.y - beforeLast.y) / endLen * pad), endAngle);
  return group;
}

function tacticalPolylineMidpoint(points) {
  if (!points.length) return null;
  if (points.length === 1) return L.latLng(points[0][0], points[0][1]);
  const layerPts = points.map(p => map.latLngToLayerPoint(L.latLng(p[0], p[1])));
  let total = 0;
  for (let i = 1; i < layerPts.length; i++) total += layerPts[i - 1].distanceTo(layerPts[i]);
  const half = total / 2;
  let acc = 0;
  for (let i = 1; i < layerPts.length; i++) {
    const a = layerPts[i - 1];
    const b = layerPts[i];
    const len = a.distanceTo(b);
    if (acc + len >= half) {
      const t = len > 0 ? (half - acc) / len : 0;
      return map.layerPointToLatLng(L.point(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t));
    }
    acc += len;
  }
  return L.latLng(points[points.length - 1][0], points[points.length - 1][1]);
}

function renderTacticalPositionAreaLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];

function renderTacticalFortifiedLineLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];
  if (points.length < 2) return tacticalFallbackLayer(d, layer, 'Fortified line needs at least 2 points');
  const color = d.style?.color || layer?.color || '#2d74c4';
  const group = L.layerGroup();
  const interactive = options.interactive !== false;
  const base = L.polyline(points, { color, weight: d.style?.weight || 1, interactive, bubblingMouseEvents: false, className: 'tg-fortified-line' });
  base._drawingId = d.id;
  if (interactive) base.on('click', e => tacticalLayerClicked(d, e));
  group.addLayer(base);
  const stepPx = 28;
  const tooth = 12;
  for (let i = 1; i < points.length; i++) {
    const a = map.latLngToLayerPoint(L.latLng(points[i - 1][0], points[i - 1][1]));
    const b = map.latLngToLayerPoint(L.latLng(points[i][0], points[i][1]));
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) continue;
    const ux = dx / len, uy = dy / len;
    const nx = -uy, ny = ux;
    for (let dist = stepPx; dist < len - stepPx * 0.4; dist += stepPx) {
      const cx = a.x + ux * dist, cy = a.y + uy * dist;
      const p1 = map.layerPointToLatLng(L.point(cx - ux * tooth * 0.5, cy - uy * tooth * 0.5));
      const p2 = map.layerPointToLatLng(L.point(cx - ux * tooth * 0.5 + nx * tooth, cy - uy * tooth * 0.5 + ny * tooth));
      const p3 = map.layerPointToLatLng(L.point(cx + ux * tooth * 0.5 + nx * tooth, cy + uy * tooth * 0.5 + ny * tooth));
      const p4 = map.layerPointToLatLng(L.point(cx + ux * tooth * 0.5, cy + uy * tooth * 0.5));
      const mark = L.polyline([p1, p2, p3, p4], { color, weight: d.style?.weight || 1, interactive, bubblingMouseEvents: false });
      mark._drawingId = d.id;
      if (interactive) mark.on('click', e => tacticalLayerClicked(d, e));
      group.addLayer(mark);
    }
  }
  return group;
}

function renderTacticalFebaLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];
  if (points.length < 2) return tacticalFallbackLayer(d, layer, 'FEBA needs at least 2 points');
  const color = d.style?.color || layer?.color || '#2d74c4';
  const group = L.layerGroup();
  const interactive = options.interactive !== false;
  const radius = 9;
  const stepPx = 30;
  for (let i = 1; i < points.length; i++) {
    const a = map.latLngToLayerPoint(L.latLng(points[i - 1][0], points[i - 1][1]));
    const b = map.latLngToLayerPoint(L.latLng(points[i][0], points[i][1]));
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len < 1) continue;
    const ux = dx / len, uy = dy / len;
    const nx = -uy, ny = ux;
    for (let dist = radius; dist <= len - radius; dist += stepPx) {
      const c = L.point(a.x + ux * dist, a.y + uy * dist);
      const ll = map.layerPointToLatLng(c);
      const circ = L.circleMarker(ll, { radius, color, weight: d.style?.weight || 1, fillOpacity: 0, interactive, bubblingMouseEvents: false });
      circ._drawingId = d.id;
      if (interactive) circ.on('click', e => tacticalLayerClicked(d, e));
      group.addLayer(circ);
      [[-1, -1, 1, 1], [-1, 1, 1, -1]].forEach(v => {
        const p1 = map.layerPointToLatLng(L.point(c.x + (ux * v[0] + nx * v[1]) * radius * 0.6, c.y + (uy * v[0] + ny * v[1]) * radius * 0.6));
        const p2 = map.layerPointToLatLng(L.point(c.x + (ux * v[2] + nx * v[3]) * radius * 0.6, c.y + (uy * v[2] + ny * v[3]) * radius * 0.6));
        const cross = L.polyline([p1, p2], { color, weight: d.style?.weight || 1, interactive, bubblingMouseEvents: false });
        cross._drawingId = d.id;
        if (interactive) cross.on('click', e => tacticalLayerClicked(d, e));
        group.addLayer(cross);
      });
    }
  }
  return group;
}

function renderTacticalBridgeGapLayer(d, layer, options = {}) {
  const points = d.geometry?.points || [];
  if (points.length < 2) return tacticalFallbackLayer(d, layer, 'Bridge/gap needs at least 2 points');
  const color = d.style?.color || layer?.color || '#2d74c4';
  const interactive = options.interactive !== false;
  const group = L.layerGroup();
  const a = map.latLngToLayerPoint(L.latLng(points[0][0], points[0][1]));
  const b = map.latLngToLayerPoint(L.latLng(points[1][0], points[1][1]));
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.max(1, Math.hypot(dx, dy));
  const ux = dx / len, uy = dy / len;
  const nx = -uy, ny = ux;
  let width = 26;
  if (points[2]) {
    const c = map.latLngToLayerPoint(L.latLng(points[2][0], points[2][1]));
    width = Math.max(12, Math.min(80, Math.abs((c.x - a.x) * nx + (c.y - a.y) * ny)));
  }
  const line = L.polyline([points[0], points[1]], { color, weight: d.style?.weight || 1, interactive, bubblingMouseEvents: false });
  line._drawingId = d.id;
  if (interactive) line.on('click', e => tacticalLayerClicked(d, e));
  group.addLayer(line);
  [a, b].forEach(p => {
    const p1 = map.layerPointToLatLng(L.point(p.x + nx * width, p.y + ny * width));
    const p2 = map.layerPointToLatLng(L.point(p.x - nx * width, p.y - ny * width));
    const cap = L.polyline([p1, p2], { color, weight: d.style?.weight || 1, interactive, bubblingMouseEvents: false });
    cap._drawingId = d.id;
    if (interactive) cap.on('click', e => tacticalLayerClicked(d, e));
    group.addLayer(cap);
  });
  return group;
}

function renderTacticalGraphicLayer(d, layer) {
  const props = d.properties || {};
  const tg = props.tactical || {};
  const points = d.geometry?.points || [];
  if (!points.length) return null;
  if (tacticalIsFlotSpec(tg)) return renderTacticalFlotLayer(d, layer);
  if (tacticalIsPointSymbolSpec(tg)) return renderTacticalPointSymbolLayer(d, layer);
  if (tg.renderer === 'custom-attack-arrow') return renderTacticalAttackArrowLayer(d, layer);
  if (tg.renderer === 'custom-labeled-line') return renderTacticalLabeledLineLayer(d, layer);
  if (tg.renderer === 'custom-position-area') return renderTacticalPositionAreaLayer(d, layer);
  if (tg.renderer === 'custom-fortified-line') return renderTacticalFortifiedLineLayer(d, layer);
  if (tg.renderer === 'custom-feba') return renderTacticalFebaLayer(d, layer);
  if (tg.renderer === 'custom-sector-boundary') return renderTacticalSectorBoundaryLayer(d, layer);
  if (tg.renderer === 'custom-bridge-gap') return renderTacticalBridgeGapLayer(d, layer);
  if (!tg.symbolCode) return tacticalFallbackLayer(d, layer, 'no renderer configured');
  if (!tacticalRendererAvailable()) return tacticalFallbackLayer(d, layer, tacticalStatusText());

  const px = tacticalPixelSize();
  const color = d.style?.color || layer?.color || '#e94560';
  const fill = d.style?.fillColor || tg.fillColor || '#ffffff';
  const attributes = {
    LINECOLOR: color,
    FILLCOLOR: fill,
    LINEWIDTH: String(d.style?.weight || 1),
    TEXTCOLOR: color,
    TEXTBACKGROUNDCOLOR: '#ffffff',
    ...(tg.attributes || {})
  };
  const modifiers = {
    T_UNIQUE_DESIGNATION_1: props.label || tg.name || '',
    ...(tg.modifiers || {})
  };

  try {
    if (C5Ren.init) C5Ren.init();
    const raw = C5Ren.WebRenderer.RenderSymbol2D(
      d.id || uid(),
      tg.name || props.label || 'Tactical Graphic',
      tg.description || '',
      tg.symbolCode,
      tacticalControlPoints(points),
      px.w,
      px.h,
      tacticalBbox(),
      tacticalMapObject(modifiers),
      tacticalMapObject(attributes),
      C5Ren.WebRenderer.OUTPUT_FORMAT_GEOJSON
    );
    if (!raw) return tacticalFallbackLayer(d, layer, 'empty renderer response');
    const parsed = JSON.parse(raw);
    if (parsed.type === 'error') {
      return tacticalFallbackLayer(d, layer, parsed.error || 'renderer error');
    }
    const rendered = L.geoJSON(parsed, {
      style: feature => tacticalStyleForFeature(feature, color, fill),
      pointToLayer: tacticalPointLayer
    });
    rendered.eachLayer(child => {
      child._drawingId = d.id;
      if (child.options) child.options.bubblingMouseEvents = false;
      child.on('click', e => tacticalLayerClicked(d, e));
    });
    return rendered;
  } catch (err) {
    console.warn('[bg_clasher] tactical graphic render failed', err);
    return tacticalFallbackLayer(d, layer, err.message || String(err));
  }
}

function tacticalOffset(center, eastM, northM) {
  const lat = center.lat + northM / 111320;
  const lng = center.lng + eastM / (111320 * Math.cos(center.lat * Math.PI / 180));
  return [lat, lng];
}

function tacticalSamplePoints(preset, center, idx) {
  const x = (idx % 2) * 2600 - 1300;
  const y = Math.floor(idx / 2) * -1800 + 900;
  if (preset.sample === 'point-symbol') {
    const p = tacticalOffset(center, x, y);
    return tacticalDefaultPointSymbolPoints(L.latLng(p[0], p[1]), preset);
  }
  if (preset.sample === 'flot') {
    return [
      tacticalOffset(center, x - 1300, y),
      tacticalOffset(center, x + 1300, y)
    ];
  }
  if (preset.sample === 'attack-arrow') {
    return [
      tacticalOffset(center, x - 900, y + 380),
      tacticalOffset(center, x - 150, y - 120),
      tacticalOffset(center, x + 950, y - 360)
    ];
  }
  if (preset.sample === 'coord-line') {
    return [
      tacticalOffset(center, x - 1200, y),
      tacticalOffset(center, x + 1200, y + 120)
    ];
  }
  if (preset.sample === 'passage') {
    return [
      tacticalOffset(center, x - 900, y),
      tacticalOffset(center, x + 900, y),
      tacticalOffset(center, x, y + 450)
    ];
  }
  if (preset.sample === 'line') {
    return [
      tacticalOffset(center, x - 1500, y + 200),
      tacticalOffset(center, x - 500, y - 250),
      tacticalOffset(center, x + 450, y + 150),
      tacticalOffset(center, x + 1500, y - 350)
    ];
  }
  if (preset.sample === 'fan') {
    return [tacticalOffset(center, x, y)];
  }
  const spread = preset.sample === 'mine' ? 700 : 900;
  return [
    tacticalOffset(center, x - spread, y - 420),
    tacticalOffset(center, x + spread, y - 360),
    tacticalOffset(center, x + spread * 0.65, y + 520),
    tacticalOffset(center, x - spread * 0.75, y + 430)
  ];
}

function tacticalSideColor(side) {
  if (side === 'bluefor') return '#2d74c4';
  if (side === 'opfor') return '#c43a3a';
  return '#f5a623';
}

function startTacticalGraphicDraw() {
  clearTacticalSelection();
  const preset = tacticalPreset(document.getElementById('tg_preset')?.value);
  const side = document.getElementById('tg_side')?.value || state.viewRole || 'umpire';
  const label = document.getElementById('tg_label')?.value || preset.name;
  const color = document.getElementById('tg_color')?.value || tacticalSideColor(side);
  const fill = document.getElementById('tg_fill')?.value || '#ffffff';
  const weight = parseInt(document.getElementById('tg_weight')?.value, 10) || 1;
  const flipFront = !!document.getElementById('tg_flip')?.checked;
  tacticalDraft = {
    presetId: preset.id,
    side,
    label,
    color,
    fill,
    weight,
    flipFront,
    points: []
  };
  setTool('tactical');
  document.getElementById('modeDisplay').textContent = tacticalIsPointSymbolSpec(preset)
    ? `${preset.name}: click map to place symbol with direction/scale handles`
    : `${preset.name}: click ${preset.minPoints}+ control point(s), then Enter`;
  LG.tempDraw.clearLayers();
  closePanel();
}

function addTacticalGraphicPoint(latlng) {
  if (!tacticalDraft) return;
  const preset = tacticalPreset(tacticalDraft.presetId);
  if (tacticalIsPointSymbolSpec(preset)) {
    tacticalDraft.points = tacticalDefaultPointSymbolPoints(latlng, preset);
    finishTacticalGraphic();
    return;
  }
  tacticalDraft.points.push([latlng.lat, latlng.lng]);
  renderTacticalDraftPreview();
  const count = tacticalDraft.points.length;
  document.getElementById('modeDisplay').textContent =
    `${preset.name}: ${count}/${preset.minPoints} point(s)${count >= preset.minPoints ? ' - Enter to finish' : ''}`;
  if (document.getElementById('panelTitle')?.textContent === 'Tactical Graphics Prototype') {
    renderTacticalGraphicsPanel(document.getElementById('panelBody'));
  }
}

function renderTacticalDraftPreview(cursorLatlng = null) {
  LG.tempDraw.clearLayers();
  if (!tacticalDraft) return;
  const preset = tacticalPreset(tacticalDraft.presetId);
  const previewPoints = cloneDeep(tacticalDraft.points);
  if (cursorLatlng) previewPoints.push([cursorLatlng.lat, cursorLatlng.lng]);
  tacticalDraft.points.forEach(p => {
    L.circleMarker(p, { radius: 4, color: tacticalDraft.color, fillColor: '#fff', fillOpacity: 1, weight: 2, interactive: false }).addTo(LG.tempDraw);
  });
  const layer = getLayer(state.currentLayerId);
  const draftDrawing = tacticalDraftAsDrawing(previewPoints);
  if (tacticalIsPointSymbolSpec(preset) && previewPoints.length >= 1 && draftDrawing) {
    const marker = renderTacticalPointSymbolLayer(draftDrawing, layer, { interactive: false, draggable: false, size: 60 });
    if (marker) marker.addTo(LG.tempDraw);
    tacticalPreviewLayer = marker;
  } else if (tacticalIsFlotSpec(preset) && previewPoints.length >= 2 && draftDrawing) {
    const flot = renderTacticalFlotLayer(draftDrawing, layer, { interactive: false });
    if (flot) flot.addTo(LG.tempDraw);
    tacticalPreviewLayer = flot;
  } else if (previewPoints.length >= 2) {
    const preview = preset.geometry === 'area' && previewPoints.length >= 3
      ? L.polygon(previewPoints, { color: tacticalDraft.color, weight: 2, dashArray: '4,4', fillOpacity: 0.08, interactive: false })
      : L.polyline(previewPoints, { color: tacticalDraft.color, weight: 2, dashArray: '4,4', interactive: false });
    preview.addTo(LG.tempDraw);
    tacticalPreviewLayer = preview;
  }
}

function finishTacticalGraphic() {
  if (!tacticalDraft) return false;
  const preset = tacticalPreset(tacticalDraft.presetId);
  if (tacticalDraft.points.length < preset.minPoints) {
    document.getElementById('modeDisplay').textContent = `${preset.name} needs at least ${preset.minPoints} control point(s)`;
    return true;
  }
  addDrawing({
    type: 'tactical-graphic',
    layerId: state.currentLayerId,
    geometry: { points: cloneDeep(tacticalDraft.points) },
    style: { color: tacticalDraft.color, fillColor: tacticalDraft.fill, weight: tacticalDraft.weight },
    properties: {
      label: tacticalDraft.label,
      tactical: {
        presetId: preset.id,
        name: preset.name,
        symbolCode: preset.sidc,
        geometry: preset.geometry,
        renderer: preset.renderer || '',
        drawMode: preset.drawMode || preset.geometry,
        minPoints: preset.minPoints,
        pixelSize: preset.pixelSize || 72,
        controlPoints: preset.controlPoints || 0,
        fallbackText: preset.fallbackText || '',
        arrowStyle: preset.arrowStyle || '',
        lineLabel: preset.lineLabel || '',
        lineSubLabel: preset.lineSubLabel || '',
        areaLabel: preset.areaLabel || '',
        areaName: preset.areaName || '',
        echelon: preset.echelon || '',
        doubleFront: !!preset.doubleFront,
        flipFront: !!tacticalDraft.flipFront,
        modifiers: cloneDeep(preset.modifiers || {}),
        attributes: cloneDeep(preset.attributes || {}),
        description: preset.description || ''
      }
    }
  });
  cancelTacticalDraft();
  setTool('pan');
  openPanel('tactical');
  return true;
}

function cancelTacticalDraft() {
  tacticalDraft = null;
  tacticalPreviewLayer = null;
  LG.tempDraw.clearLayers();
}

function renderTacticalSamples() {
  const center = map.getCenter();
  TACTICAL_GRAPHIC_PRESETS.forEach((preset, idx) => {
    const side = idx % 2 === 0 ? 'bluefor' : 'opfor';
    addDrawing({
      type: 'tactical-graphic',
      layerId: state.currentLayerId,
      geometry: { points: tacticalSamplePoints(preset, center, idx) },
      style: {
        color: tacticalSideColor(side),
        fillColor: (preset.geometry === 'area' || tacticalIsPointSymbolSpec(preset)) ? '#ffffff' : tacticalSideColor(side),
        weight: 1
      },
      properties: {
        label: preset.name,
        tactical: {
          presetId: preset.id,
          name: preset.name,
          symbolCode: preset.sidc,
          geometry: preset.geometry,
          renderer: preset.renderer || '',
          drawMode: preset.drawMode || preset.geometry,
          minPoints: preset.minPoints,
          pixelSize: preset.pixelSize || 72,
          controlPoints: preset.controlPoints || 0,
          fallbackText: preset.fallbackText || '',
          arrowStyle: preset.arrowStyle || '',
          lineLabel: preset.lineLabel || '',
          lineSubLabel: preset.lineSubLabel || '',
          areaLabel: preset.areaLabel || '',
          areaName: preset.areaName || '',
          echelon: preset.echelon || '',
          doubleFront: !!preset.doubleFront,
          flipFront: false,
          modifiers: cloneDeep(preset.modifiers || {}),
          attributes: cloneDeep(preset.attributes || {}),
          description: preset.description || ''
        }
      }
    });
  });
  renderDrawings();
  refreshLayersPanelIfOpen();
  renderTacticalGraphicsPanel(document.getElementById('panelBody'));
}

function clearTacticalPrototypeGraphics() {
  confirmModal('Delete all tactical graphics prototype drawings?').then(ok => {
    if (!ok) return;
    clearTacticalSelection();
    state.drawings = state.drawings.filter(d => d.type !== 'tactical-graphic');
    cancelTacticalDraft();
    renderDrawings();
    refreshLayersPanelIfOpen();
    syncMirrors();
    if (document.getElementById('panelTitle')?.textContent === 'Tactical Graphics Prototype') {
      renderTacticalGraphicsPanel(document.getElementById('panelBody'));
    }
  });
}

function tacticalJsonValue(id, fallback) {
  const raw = document.getElementById(id)?.value || '';
  if (!raw.trim()) return fallback || {};
  try {
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : fallback || {};
  } catch (err) {
    alert(`Invalid JSON in ${id}`);
    return fallback || {};
  }
}

  const presetOptions = TACTICAL_GRAPHIC_PRESETS.map(p =>

  ).join('');
  const side = state.viewRole === 'opfor' ? 'opfor' : 'bluefor';
  const existing = state.drawings.filter(d => d.type === 'tactical-graphic');
  const existingHtml = existing.length
    ? existing.map(d => {

        return `<div class="list-item" style="align-items:center;gap:6px">
          <div style="flex:1;min-width:0">

            <div style="font-size:10px;color:var(--text-dim);font-family:var(--mono)">${esc(tg.symbolCode || '')} · ${pts.length} point(s)</div>
          </div>
          <button class="small" onclick="panToDrawing('${d.id}')">Pan</button>

        <div class="btn-row" style="margin-top:6px">
          <button onclick="finishTacticalGraphic()">Finish</button>
          <button class="ghost" onclick="cancelTacticalDraft();setTool('pan');renderTacticalGraphicsPanel(document.getElementById('panelBody'))">Cancel</button>
        </div>
      </div>`
    : '';
  body.innerHTML = `
    <div class="field-group">
      <label>Renderer Status</label>
      <div style="font-family:var(--mono);font-size:11px;color:${tacticalRendererAvailable() ? 'var(--success)' : 'var(--warning)'}">${esc(tacticalStatusText())}</div>
      <p style="font-size:11px;color:var(--text-dim);margin-top:5px">Prototype loads Mission Command mil-sym-ts-web 2.9.1 from unpkg for renderer-backed graphics. FLOT uses a custom APP-6-style half-circle overlay for live orientation preview.</p>
    </div>
    <div class="field-group"><label>Graphic</label>
      <select id="tg_preset">${presetOptions}</select></div>
    <div class="field-grid two">
      <div><label>Side Colour</label>
        <select id="tg_side" onchange="document.getElementById('tg_color').value=tacticalSideColor(this.value)">
          <option value="bluefor" ${side === 'bluefor' ? 'selected' : ''}>BLUFOR</option>
          <option value="opfor" ${side === 'opfor' ? 'selected' : ''}>OPFOR</option>
          <option value="umpire">Neutral</option>
        </select></div>
      <div><label>Line Colour</label><input type="color" id="tg_color" value="${tacticalSideColor(side)}"></div>
      <div><label>Fill Colour</label><input type="color" id="tg_fill" value="#ffffff"></div>
      <div><label>Line Weight</label><input type="number" id="tg_weight" min="1" max="8" value="1"></div>
    </div>
    <div class="field-group">
      <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="tg_flip"> Reverse FLOT front side</label>
      <div style="font-size:10px;color:var(--text-dim);margin-top:4px">Default FLOT frontage is to the right of the drawn line.</div>
    </div>
    <div class="field-group"><label>Label / Unique Designation</label>
      <input type="text" id="tg_label" value="TG-1"></div>
    <div class="btn-row">

      <button onclick="renderTacticalSamples()">Render Samples</button>
      <button class="danger" onclick="clearTacticalPrototypeGraphics()">Clear Prototype Graphics</button>
    </div>
    ${draftHtml}

function renderDrawings() {
  LG.drawings.clearLayers();
  LG.text.clearLayers();
  LG.symbols.clearLayers();

  state.drawings.forEach(d => {
    if (d.visible === false) return;
    const layer = getLayer(d.layerId);
    if (!layer || !canSeeLayer(layer)) return;

    let leafletLayer = null;
    const style = d.style || {};
    const color = style.color || layer.color;

    if (d.type === 'tactical-graphic') {
      leafletLayer = renderTacticalGraphicLayer(d, layer);
    } else if (d.type === 'polyline') {
      leafletLayer = L.polyline(d.geometry.points, {
        color, weight: style.weight || 1,
        opacity: style.opacity ?? 1,
        dashArray: style.dashArray || null
      });
    } else if (d.type === 'polygon') {
      leafletLayer = L.polygon(d.geometry.points, {
        color, weight: style.weight || 1,
        fillOpacity: style.fillOpacity ?? 0.2,
        opacity: style.opacity ?? 1,
        dashArray: style.dashArray || null
      });
    } else if (d.type === 'circle') {
      leafletLayer = L.circle(d.geometry.center, {
        radius: d.geometry.radius,
        color, weight: style.weight || 1,
        fillOpacity: style.fillOpacity ?? 0.15,
        opacity: style.opacity ?? 1,
        dashArray: style.dashArray || null
      });
    } else if (d.type === 'text') {
      const props = d.properties || {};
      const bg = props.background ?? 'rgba(22, 33, 62, 0.55)';
      const textColor = props.textColor || '#ffffff';
      const size = props.size || 13;
      const html = `<div class="text-annot" style="background:${bg};color:${textColor};font-size:${size}px">${esc(props.text || '')}</div>`;
      const tmarker = L.marker(d.geometry.latlng, {
        icon: L.divIcon({ className: '', html, iconSize: null, iconAnchor: [0, 0] }),
        draggable: true
      });
      tmarker._drawingId = d.id;
      tmarker.on('dragend', e => {
        const p = e.target.getLatLng();
        d.geometry.latlng = [p.lat, p.lng];
      });
      tmarker.on('click', () => {
        if (!drawHandler || !drawHandler._enabled) openDrawingEditor(d);
      });
      LG.text.addLayer(tmarker);
      return;
    } else if (d.type === 'symbol') {
      const tmpl = state.symbolTemplates.find(s => s.id === d.properties.symbolId);
      if (!tmpl) return;
      const label = d.properties.label || '';
      const rotation = d.properties.rotation || 0;
      // Parse SVG width/height for sizing
      const wm = tmpl.svg.match(/width="(\d+)"/);
      const hm = tmpl.svg.match(/height="(\d+)"/);
      const sw = wm ? parseInt(wm[1]) : 28;
      const sh = hm ? parseInt(hm[1]) : 28;
      // Icon container is sized exactly to the SVG; rotation pivots around center
      const rotatedSvg = `<div style="width:${sw}px;height:${sh}px;transform:rotate(${rotation}deg);transform-origin:center">${tmpl.svg}</div>`;
      const labelHtml = label
        ? `<div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;text-align:center;background:rgba(0,0,0,0.5);color:#fff;font-size:10px;padding:1px 4px;border-radius:2px;white-space:nowrap">${esc(label)}</div>`
        : '';
      const html = `<div style="position:relative;width:${sw}px;height:${sh}px">${rotatedSvg}${labelHtml}</div>`;
      const smarker = L.marker(d.geometry.latlng, {
        icon: L.divIcon({ className: '', html, iconSize: [sw, sh], iconAnchor: [sw/2, sh/2] }),
        draggable: true
      });
      smarker._drawingId = d.id;
      smarker.on('dragend', e => {
        const p = e.target.getLatLng();
        d.geometry.latlng = [p.lat, p.lng];
      });
      smarker.on('click', () => {
        if (!drawHandler || !drawHandler._enabled) openDrawingEditor(d);
      });
      LG.symbols.addLayer(smarker);
      return;
    }

    if (leafletLayer) {
      leafletLayer._drawingId = d.id;
      leafletLayer.on('click', e => {
        if (d.type === 'tactical-graphic') {
          tacticalLayerClicked(d, e);
          return;
        }
        if (!drawHandler || !drawHandler._enabled) openDrawingEditor(d);
      });
      if (d.properties && d.properties.label) {
        leafletLayer.bindTooltip(d.properties.label, { sticky: true, className: 'marker-tooltip' });
      }
      LG.drawings.addLayer(leafletLayer);
    }
  });
  renderTacticalControlPoints();
}

function openDrawingEditor(d) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const layer = getLayer(d.layerId);
  const style = d.style || {};
  const props = d.properties || {};

  let specificFields = '';
  if (d.type === 'text') {
    specificFields = `
      <div class="field-group"><label>Text</label>
        <textarea id="de_text">${esc(props.text || '')}</textarea></div>
      <div class="field-group"><label>Text Color</label>
        <input type="color" id="de_textColor" value="${props.textColor || '#ffffff'}"></div>
      <div class="field-group"><label>Background (CSS color, leave blank for none)</label>
        <input type="text" id="de_bg" value="${esc(props.background ?? 'rgba(22, 33, 62, 0.55)')}"></div>
      <div class="field-group"><label>Size (px)</label>
        <input type="number" id="de_size" value="${props.size || 13}" min="8" max="48"></div>`;
  } else if (d.type === 'symbol') {
    specificFields = `<div class="field-group"><label>Label</label>
      <input type="text" id="de_label" value="${esc(props.label || '')}"></div>
      <div class="field-group"><label>Rotation (°)</label>
        <input type="range" id="de_rotation" min="0" max="359" value="${props.rotation || 0}" oninput="document.getElementById('de_rot_val').textContent=this.value+'°'"> <span id="de_rot_val">${props.rotation || 0}°</span></div>`;
  } else if (d.type === 'tactical-graphic') {
    const tg = props.tactical || {};
    specificFields = `
      <div class="field-group"><label>Label / Unique Designation</label>
        <input type="text" id="de_tg_label" value="${esc(props.label || '')}"></div>
      <div class="field-group"><label>SIDC</label>
        <input type="text" id="de_tg_sidc" value="${esc(tg.symbolCode || '')}"></div>
      <div class="field-grid two">
        <div><label>Line Colour</label><input type="color" id="de_tg_color" value="${style.color || layer.color}"></div>
        <div><label>Fill Colour</label><input type="color" id="de_tg_fill" value="${style.fillColor || tg.fillColor || '#ffffff'}"></div>
        <div><label>Line Weight</label><input type="number" id="de_tg_weight" value="${style.weight || 1}" min="1" max="10"></div>
        <div><label>Control Points</label><input type="text" value="${(d.geometry?.points || []).length}" disabled></div>
      </div>
      ${tacticalIsFlotSpec(tg) ? `
      <div class="field-group">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="de_tg_flip" ${tg.flipFront ? 'checked' : ''}> Reverse FLOT front side</label>
      </div>` : ''}
      <div class="field-group"><label>Modifiers JSON</label>
        <textarea id="de_tg_modifiers" rows="3">${esc(JSON.stringify(tg.modifiers || {}, null, 2))}</textarea></div>
      <div class="field-group"><label>Attributes JSON</label>
        <textarea id="de_tg_attributes" rows="3">${esc(JSON.stringify(tg.attributes || {}, null, 2))}</textarea></div>`;
  } else {
    specificFields = `
      <div class="field-group"><label>Color</label>
        <input type="color" id="de_color" value="${style.color || layer.color}"></div>
      <div class="field-group"><label>Weight</label>
        <input type="number" id="de_weight" value="${style.weight || 1}" min="1" max="10"></div>
      <div class="field-group"><label>Opacity</label>
        <input type="number" id="de_opacity" step="0.1" min="0.1" max="1" value="${style.opacity ?? 1}"></div>
      ${(d.type === 'polygon' || d.type === 'circle') ? `
        <div class="field-group"><label>Fill Opacity</label>
          <input type="number" id="de_fillOpacity" step="0.1" min="0" max="1" value="${style.fillOpacity ?? 0.15}"></div>` : ''}
      ${(d.type === 'polyline' || d.type === 'polygon' || d.type === 'circle') ? `
        <div class="field-group"><label>Dash Pattern (e.g. "8,4" dashed · "2,4" dotted · "8,4,2,4" dash-dot · blank for solid)</label>
          <input type="text" id="de_dash" value="${style.dashArray || ''}"></div>` : ''}
      <div class="field-group"><label>Label (tooltip)</label>
        <input type="text" id="de_lbl" value="${esc(props.label || '')}"></div>`;
  }

  // Only offer layers this role may edit. Keep current layer in the list as a last resort
  // so legacy objects remain selectable, but mark it.
  const editableLayers = state.layers.filter(l => canEditLayer(l));
  const layerPool = editableLayers.some(l => l.id === d.layerId)
    ? editableLayers
    : [...editableLayers, getLayer(d.layerId)].filter(Boolean);
  const layerOptions = layerPool.map(l =>
    `<option value="${l.id}" ${l.id === d.layerId ? 'selected' : ''}>${esc(l.name)} [${l.visibility}${l.editability && l.editability !== l.visibility ? ' · edit:'+l.editability : ''}]</option>`
  ).join('');

  overlay.innerHTML = `
    <div class="modal">
      <h3>Edit Drawing — ${d.type}</h3>
      <div class="field-group"><label>Layer</label>
        <select id="de_layerId">${layerOptions}</select></div>
      ${specificFields}
      <div class="btn-row">
        <button onclick="saveDrawingEdit('${d.id}');this.closest('.modal-overlay').remove()">Save</button>
        <button class="danger" onclick="deleteDrawing('${d.id}');this.closest('.modal-overlay').remove()">Delete</button>
        <button onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function saveDrawingEdit(id) {
  const d = state.drawings.find(x => x.id === id);
  if (!d) return;
  const getVal = (eid) => { const el = document.getElementById(eid); return el ? el.value : null; };

  d.layerId = getVal('de_layerId');
  d.style = d.style || {};
  d.properties = d.properties || {};

  if (d.type === 'text') {
    d.properties.text = getVal('de_text');
    d.properties.textColor = getVal('de_textColor');
    d.properties.background = getVal('de_bg');
    d.properties.size = parseInt(getVal('de_size')) || 13;
  } else if (d.type === 'symbol') {
    d.properties.label = getVal('de_label');
    d.properties.rotation = parseInt(getVal('de_rotation')) || 0;
  } else if (d.type === 'tactical-graphic') {
    d.properties.label = getVal('de_tg_label');
    d.properties.tactical = d.properties.tactical || {};
    d.properties.tactical.symbolCode = getVal('de_tg_sidc');
    d.properties.tactical.modifiers = tacticalJsonValue('de_tg_modifiers', d.properties.tactical.modifiers || {});
    d.properties.tactical.attributes = tacticalJsonValue('de_tg_attributes', d.properties.tactical.attributes || {});
    const flip = document.getElementById('de_tg_flip');
    if (flip) d.properties.tactical.flipFront = flip.checked;
    d.style.color = getVal('de_tg_color');
    d.style.fillColor = getVal('de_tg_fill');
    d.style.weight = parseInt(getVal('de_tg_weight')) || 1;
  } else {
    d.style.color = getVal('de_color');
    d.style.weight = parseInt(getVal('de_weight')) || 1;
    d.style.opacity = parseFloat(getVal('de_opacity')) || 1;
    if (d.type === 'polygon' || d.type === 'circle') {
      d.style.fillOpacity = getVal('de_fillOpacity') !== '' ? parseFloat(getVal('de_fillOpacity')) : 0.15;
    }
    if (d.type === 'polyline' || d.type === 'polygon' || d.type === 'circle') {
      d.style.dashArray = getVal('de_dash') || null;
    }
    d.properties.label = getVal('de_lbl');
  }
  renderDrawings();
  refreshLayersPanelIfOpen();
  refreshTacticalPanelIfOpen();
  syncMirrors();
}

// ═══════════════════════════════════════════════════════════════════
// TOOLS
// ═══════════════════════════════════════════════════════════════════
let currentTool = 'pan';
let drawHandler = null;
let circleDraft = null; // { center: [lat,lng], previewLayer: L.circle }
let measurePoints = [];
let measurePreviewLine = null;
let movementDraft = null; // {unitId, points, mode}

const TOOL_LABELS = {
  pan: 'Select / Pan',
  unit: 'Click to place unit',
  move: 'Click unit to add order — then click waypoints · Enter to accept',
  marker: 'Click to place game marker',
  symbol: 'Click to place map symbol',
  line: 'Click to draw — double-click or Enter to finish',
  poly: 'Click to draw — double-click or Enter to finish',
  circle: 'Click-drag to draw circle',
  text: 'Click to place text',
  measure: 'Click waypoints — double-click to finish',
  angle: 'Click vertex, then two arm points',
  ring: 'Click to place range ring',
  tactical: 'Click control points - Enter to finish tactical graphic',
  edit: 'Click any item to edit or delete'
};

function setTool(name) {
  if (!['pan','edit'].includes(name)) clearTacticalSelection();
  currentTool = name;
  document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + name);
  if (btn) btn.classList.add('active');

  document.getElementById('modeDisplay').textContent = TOOL_LABELS[name] || name;

  // Cancel draw handler
  if (drawHandler) {
    drawHandler.disable();
    drawHandler = null;
  }
  // Clear measure
  measurePoints = [];
  LG.measure.clearLayers();
  document.getElementById('measureReadout').textContent = '';
  // Clear movement draft
  if (name !== 'move') cancelMovementDraft();
  if (name !== 'tactical') cancelTacticalDraft();

  map.getContainer().style.cursor = name === 'pan' ? 'default' : 'crosshair';

  // Show/hide style bar for drawing tools
  const styleBar = document.getElementById('drawStyleBar');
  if (styleBar) {
    styleBar.style.display = ['line','poly','circle','ring'].includes(name) ? 'flex' : 'none';
    // Mark the currently-selected dash swatch as active
    styleBar.querySelectorAll('.dsb-swatch').forEach(s => s.classList.remove('active'));
    const curDash = state.drawingStyle.dashArray;
    const matchAttr = curDash === null ? 'solid' : curDash;
    const active = styleBar.querySelector(`.dsb-swatch[data-dash="${matchAttr}"]`);
    if (active) active.classList.add('active');
  }
  // Show/hide snap bar for drawing tools (line/poly/circle all support snap-length)
  const snapBar = document.getElementById('snapBar');
  if (snapBar) {
    snapBar.style.display = ['line','poly','circle'].includes(name) ? 'flex' : 'none';
  }
  // Clear angle measurement
  anglePoints = [];
  // Clear circle draft when leaving circle tool (or re-entering)
  cancelCircleDraft();

  const dash = state.drawingStyle.dashArray;
  const layerColor = getLayer(state.currentLayerId)?.color || '#e94560';

  // Leaflet.Draw for line/polygon shape drawing. Circle uses our own click-click flow below.
  if (name === 'line') {
    drawHandler = new L.Draw.Polyline(map, { repeatMode: true, shapeOptions: { color: layerColor, weight: 1, dashArray: dash } });
    drawHandler.enable();
  } else if (name === 'poly') {
    drawHandler = new L.Draw.Polygon(map, { repeatMode: true, shapeOptions: { color: layerColor, weight: 1, fillOpacity: 0.2, dashArray: dash } });
    drawHandler.enable();
  }
  // circle: handled via map.on('click') + map.on('mousemove') using circleDraft state
}

function setDrawDash(dash, btn) {
  state.drawingStyle.dashArray = dash;
  document.querySelectorAll('#drawStyleBar .dsb-swatch').forEach(s => s.classList.remove('active'));
  if (btn) btn.classList.add('active');
  // Re-enable the current draw handler with new style
  if (drawHandler && ['line','poly','circle','ring'].includes(currentTool)) {
    setTool(currentTool);
  }
}

map.on(L.Draw.Event.CREATED, e => {
  const t = e.layerType;
  const layer = e.layer;
  const color = layer.options.color;
  const dash = state.drawingStyle.dashArray;
  let drawing = { layerId: state.currentLayerId, style: { color } };
  if (dash) drawing.style.dashArray = dash;

  if (t === 'polyline') {
    drawing.type = 'polyline';
    drawing.geometry = { points: layer.getLatLngs().map(ll => [ll.lat, ll.lng]) };
    drawing.style.weight = 3;
  } else if (t === 'polygon') {
    drawing.type = 'polygon';
    drawing.geometry = { points: layer.getLatLngs()[0].map(ll => [ll.lat, ll.lng]) };
    drawing.style.weight = 2;
    drawing.style.fillOpacity = 0.2;
  } else if (t === 'circle') {
    drawing.type = 'circle';
    drawing.geometry = { center: [layer.getLatLng().lat, layer.getLatLng().lng], radius: layer.getRadius() };
    drawing.style.weight = 2;
    drawing.style.fillOpacity = 0.15;
  }
  addDrawing(drawing);

  // Continuous drawing handled by repeatMode: true on the handler
});

// Live measurement during polygon/polyline drawing
map.on('draw:drawvertex', e => {
  if (!drawHandler) return;
  const poly = drawHandler._poly;
  if (!poly) return;
  const lls = poly.getLatLngs();
  const pts = Array.isArray(lls[0]) ? lls[0] : lls;

  // Apply snap to last placed vertex
  if ((snapState.angle || snapState.length) && pts.length >= 2) {
    const prev = pts[pts.length - 2];
    const last = pts[pts.length - 1];
    const [sLat, sLng] = snapPoint(prev.lat, prev.lng, last.lat, last.lng);
    last.lat = sLat;
    last.lng = sLng;
    poly.setLatLngs(lls);
    // Also update the marker in draw handler's guide layers
    if (drawHandler._markers && drawHandler._markers.length > 0) {
      const lastMarker = drawHandler._markers[drawHandler._markers.length - 1];
      if (lastMarker) lastMarker.setLatLng([sLat, sLng]);
    }
  }

  if (pts.length < 2) return;
  // Total perimeter
  let perim = 0;
  for (let i = 1; i < pts.length; i++) perim += pts[i-1].distanceTo(pts[i]);
  let msg = `Total: ${formatDist(perim)}`;
  // Area for polygons (3+ points)
  if (currentTool === 'poly' && pts.length >= 3) {
    const ptArr = pts.map(p => [p.lat, p.lng]);
    const area = polygonAreaM2(ptArr);
    msg += ` · Area: ${formatArea(area)}`;
  }
  document.getElementById('measureReadout').textContent = msg;
});

map.on('draw:drawstop', () => {
  document.getElementById('measureReadout').textContent = '';
  document.getElementById('drawTooltip').style.display = 'none';
});

// ═══════════════════════════════════════════════════════════════════
// MAP CLICK DISPATCHER
// ═══════════════════════════════════════════════════════════════════
function bearing(lat1, lng1, lat2, lng2) {
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const la1 = lat1 * Math.PI / 180, la2 = lat2 * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLng);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

map.on('mousemove', e => {
  document.getElementById('coordDisplay').textContent =
    `${e.latlng.lat.toFixed(5)}°N  ${e.latlng.lng.toFixed(5)}°E`;

  // Floating tooltip during drawing
  const tip = document.getElementById('drawTooltip');
  if (drawHandler && drawHandler._poly && ['line','poly'].includes(currentTool)) {
    const pts = drawHandler._poly.getLatLngs();
    const flat = Array.isArray(pts[0]) ? pts[0] : pts;
    if (flat.length >= 1) {
      const lastPt = flat[flat.length - 1];
      let targetLat = e.latlng.lat, targetLng = e.latlng.lng;
      // Apply snap preview
      if (snapState.angle || snapState.length) {
        [targetLat, targetLng] = snapPoint(lastPt.lat, lastPt.lng, targetLat, targetLng);
      }
      const segDist = L.latLng(lastPt).distanceTo(L.latLng(targetLat, targetLng));
      const brg = bearing(lastPt.lat, lastPt.lng, targetLat, targetLng);
      // Total distance of placed segments
      let totalDist = 0;
      for (let i = 1; i < flat.length; i++) totalDist += flat[i-1].distanceTo(flat[i]);
      const grandTotal = totalDist + segDist;
      let lines = [];
      const snapTag = (snapState.angle || snapState.length) ? ' ⊞' : '';
      lines.push(`${formatDist(segDist)} (this segment)${snapTag}`);
      lines.push(`${brg.toFixed(1)}°`);
      if (totalDist > 0) lines.push(`${formatDist(grandTotal)} (total)`);
      if (currentTool === 'poly' && flat.length >= 2) {
        const ptArr = [...flat.map(p => [p.lat, p.lng]), [targetLat, targetLng]];
        const area = polygonAreaM2(ptArr);
        lines.push(`Area: ${formatArea(area)}`);
      }
      lines.push(currentTool === 'poly' ? 'Click to continue drawing shape.' : 'Click to continue drawing line.');
      tip.innerHTML = lines.join('<br>');
      tip.style.display = 'block';
      const pt = map.latLngToContainerPoint(e.latlng);
      tip.style.left = (pt.x + 18) + 'px';
      tip.style.top = (pt.y + 48) + 'px'; // offset for topbar
    }
  } else if (currentTool === 'measure' && measurePoints.length >= 1) {
    // Measure tool live preview: dashed line from last anchor to cursor + tooltip
    const last = measurePoints[measurePoints.length - 1];
    if (measurePreviewLine) { LG.measure.removeLayer(measurePreviewLine); measurePreviewLine = null; }
    measurePreviewLine = L.polyline([last, [e.latlng.lat, e.latlng.lng]], {
      color: '#e94560', weight: 2, dashArray: '3,4', opacity: 0.7, interactive: false
    });
    LG.measure.addLayer(measurePreviewLine);
    const segDist = L.latLng(last).distanceTo(e.latlng);
    const brg = bearing(last[0], last[1], e.latlng.lat, e.latlng.lng);
    let totalSoFar = 0;
    for (let i = 1; i < measurePoints.length; i++) {
      totalSoFar += L.latLng(measurePoints[i-1]).distanceTo(L.latLng(measurePoints[i]));
    }
    const grandTotal = totalSoFar + segDist;
    let lines = [`${formatDist(segDist)} (this segment)`, `${brg.toFixed(1)}°`];
    if (totalSoFar > 0) lines.push(`${formatDist(grandTotal)} (total)`);
    lines.push('Click to add point · double-click or Enter to finish');
    tip.innerHTML = lines.join('<br>');
    tip.style.display = 'block';
    const pt = map.latLngToContainerPoint(e.latlng);
    tip.style.left = (pt.x + 18) + 'px';
    tip.style.top = (pt.y + 48) + 'px';
  } else if (currentTool === 'circle' && circleDraft && circleDraft.center) {
    // Circle click-click preview handled in its own helper
    updateCircleDraftPreview(e.latlng);
  } else if (currentTool === 'angle' && anglePoints.length >= 1 && anglePoints.length < 3) {
    // Angle measurement live preview: arm line + distance + bearing (+ angle once vertex is placed)
    if (anglePreviewLayer) { LG.measure.removeLayer(anglePreviewLayer); anglePreviewLayer = null; }
    const last = anglePoints[anglePoints.length - 1];
    anglePreviewLayer = L.polyline([last, [e.latlng.lat, e.latlng.lng]], {
      color: '#f5a623', weight: 2, dashArray: '3,4', opacity: 0.7, interactive: false
    });
    LG.measure.addLayer(anglePreviewLayer);
    const segDist = L.latLng(last).distanceTo(e.latlng);
    const brg = bearing(last[0], last[1], e.latlng.lat, e.latlng.lng);
    let lines = [`${formatDist(segDist)}`, `${brg.toFixed(1)}°`];
    if (anglePoints.length === 1) {
      lines.push('Click to set vertex');
    } else if (anglePoints.length === 2) {
      // Live angle between first arm and cursor arm
      const v = anglePoints[1];
      const brgA = bearing(v[0], v[1], anglePoints[0][0], anglePoints[0][1]);
      const brgB = bearing(v[0], v[1], e.latlng.lat, e.latlng.lng);
      let ang = Math.abs(brgB - brgA);
      if (ang > 180) ang = 360 - ang;
      lines.push(`Angle: ${ang.toFixed(1)}°`);
      lines.push('Click to finish');
    }
    tip.innerHTML = lines.join('<br>');
    tip.style.display = 'block';
    const pt = map.latLngToContainerPoint(e.latlng);
    tip.style.left = (pt.x + 18) + 'px';
    tip.style.top = (pt.y + 48) + 'px';
  } else if (currentTool === 'tactical' && tacticalDraft) {
    renderTacticalDraftPreview(e.latlng);
    const preset = tacticalPreset(tacticalDraft.presetId);
    const count = tacticalDraft.points.length;
    const lines = [preset.name];
    if (tacticalIsPointSymbolSpec(preset)) {
      lines.push('Click to place symbol with edit handles');
    } else {
      const previewCount = count + 1;
      lines.push(`${count}/${preset.minPoints} committed point(s)`);
      lines.push(previewCount >= preset.minPoints ? 'Click to add point - Enter to finish' : 'Click to add control point');
    }
    tip.innerHTML = lines.join('<br>');
    tip.style.display = 'block';
    const pt = map.latLngToContainerPoint(e.latlng);
    tip.style.left = (pt.x + 18) + 'px';
    tip.style.top = (pt.y + 48) + 'px';
  } else {
    tip.style.display = 'none';
    if (measurePreviewLine) { LG.measure.removeLayer(measurePreviewLine); measurePreviewLine = null; }
    if (anglePreviewLayer) { LG.measure.removeLayer(anglePreviewLayer); anglePreviewLayer = null; }
  }
});
